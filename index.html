<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Coxing Simulator">
<meta name="theme-color" content="#061d36">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Coxing Simulator</title>
<style>
:root{--navy:#061d36;--navy2:#0a3155;--blue:#168df0;--water:#0a5f92;--water2:#0b7cac;--line:rgba(255,255,255,.55);--text:#fff}
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#061d36;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text);touch-action:manipulation}button,input,select{font:inherit}button{-webkit-tap-highlight-color:transparent}
.app{height:100%;display:flex;flex-direction:column;background:#061d36}
header{height:86px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:12px 24px;background:linear-gradient(180deg,#061d36,#082b4b);gap:18px}
.brand{display:flex;align-items:center;gap:14px;min-width:250px}.appIcon{width:48px;height:48px;border-radius:12px}.title{font-size:27px;font-weight:900;letter-spacing:-.5px}.tag{font-size:12px;color:#b7cee3;margin-top:2px}
.metrics{display:flex;align-items:stretch;background:#062642;border:1px solid #164d76;border-radius:14px;overflow:hidden}.metric{min-width:135px;padding:10px 20px;border-right:1px solid #164d76}.metric:last-child{border:0}.metric small{display:block;color:#a8c5dc;font-size:11px}.metric b{display:block;font-size:19px;margin-top:2px}.metric select{background:transparent;border:0;color:#fff;font-size:19px;font-weight:900;outline:0}
.windbox{display:flex;align-items:center;gap:12px;background:#062642;border:1px solid #164d76;border-radius:14px;padding:9px 15px;min-width:175px}.windIcon{font-size:30px}.windbox small{display:block;color:#a8c5dc;font-size:11px}.windbox b{font-size:17px}.settings{height:48px;border:0;background:#0b3155;color:#fff;border-radius:12px;padding:0 18px;font-weight:800}
#course{position:relative;flex:1;min-height:0;overflow:hidden;background:linear-gradient(180deg,#83d4f2 0%,#0c87b9 16%,#0873a5 65%,#075f8e 100%);border-top:1px solid #164d76;border-bottom:1px solid #164d76}
.water{position:absolute;inset:0;background:repeating-linear-gradient(178deg,rgba(255,255,255,.10) 0 2px,transparent 2px 12px),repeating-linear-gradient(2deg,rgba(0,30,65,.12) 0 1px,transparent 1px 17px);opacity:.65;animation:water 3s linear infinite}@keyframes water{to{background-position:120px 30px, -80px -25px}}
.skyline{position:absolute;top:0;left:0;right:0;height:18%;background:linear-gradient(180deg,#6fc9ee 0,#a7e4f8 100%);opacity:.65}.trees{position:absolute;top:8%;left:0;right:0;height:14%;background:radial-gradient(ellipse at 5% 70%,#164b38 0 7%,transparent 8%),radial-gradient(ellipse at 20% 65%,#1c5b3d 0 8%,transparent 9%),radial-gradient(ellipse at 37% 70%,#164b38 0 9%,transparent 10%),radial-gradient(ellipse at 58% 65%,#1c5b3d 0 8%,transparent 9%),radial-gradient(ellipse at 80% 70%,#164b38 0 9%,transparent 10%),radial-gradient(ellipse at 96% 65%,#1c5b3d 0 8%,transparent 9%);opacity:.9}
.lane{position:absolute;top:14%;bottom:0;width:15.5%;border-left:1px dashed rgba(255,255,255,.32);border-right:1px dashed rgba(255,255,255,.32)}.lane1{left:7%}.lane2{left:22.5%}.lane3{left:38%}.lane4{left:53.5%}.lane5{left:69%}.lane6{left:84.5%}.buoys{position:absolute;top:15%;bottom:0;left:0;right:0;pointer-events:none}.buoy{position:absolute;width:9px;height:9px;border-radius:50%;background:#ff4a3d;box-shadow:0 2px 4px rgba(0,0,0,.35)}
.start,.finish{position:absolute;left:7%;right:7%;height:9px;background:#fff;z-index:5;box-shadow:0 0 0 2px rgba(0,0,0,.2)}.start{bottom:10%}.finish{top:16%;background:repeating-linear-gradient(90deg,#111 0 14px,#fff 14px 28px)}.finishText{position:absolute;top:11%;left:50%;transform:translateX(-50%);background:#0b2138;padding:4px 28px;border-radius:4px;font-weight:900;font-size:15px;z-index:6}
#windStreams{position:absolute;inset:0;z-index:2;pointer-events:none}.windStream{position:absolute;height:2px;background:rgba(255,255,255,.65);border-radius:3px}.windStream:after{content:"";position:absolute;right:-2px;top:-4px;border-left:10px solid rgba(255,255,255,.8);border-top:5px solid transparent;border-bottom:5px solid transparent}
#windReadout{position:absolute;left:24px;top:24px;z-index:10;background:rgba(3,28,51,.78);border:1px solid rgba(255,255,255,.18);border-radius:13px;padding:9px 13px;backdrop-filter:blur(8px)}#windReadout b{font-size:15px}#windReadout small{display:block;color:#b9d4e8;margin-top:2px}
#boats{position:absolute;inset:0;z-index:4}.raceBoat{position:absolute;width:110px;height:230px;transform:translate(-50%,-50%);filter:drop-shadow(0 5px 5px rgba(0,0,0,.25));transition:transform .08s linear}.raceBoat .hull{position:absolute;left:31px;top:0;width:48px;height:225px;background:linear-gradient(90deg,#dce7ef,#fff 45%,#b7cad8);border:3px solid #21394d;border-radius:50% 50% 46% 46%/10% 10% 8% 8%;clip-path:polygon(50% 0,90% 9%,100% 92%,50% 100%,0 92%,10% 9%)}.raceBoat .deckline{position:absolute;left:39px;top:15px;width:32px;height:185px;border-left:2px solid rgba(20,40,60,.25);border-right:2px solid rgba(20,40,60,.15)}.seatline{position:absolute;left:37px;width:36px;height:4px;background:#526c80;border-radius:3px}.seat1{top:48px}.seat2{top:82px}.seat3{top:116px}.seat4{top:150px}.seat5{top:184px}.oar{position:absolute;top:70px;width:82px;height:3px;background:#b77b40;border-radius:3px;transform-origin:100% 50%}.oar:after{content:"";position:absolute;left:-15px;top:-4px;width:16px;height:11px;border-radius:2px;background:#e8eef3;border:1px solid #496177}.oarL{right:67px;transform:rotate(-10deg)}.oarR{left:67px;transform-origin:0 50%;transform:rotate(10deg)}.o2{top:104px}.o3{top:138px}.o4{top:172px}.o5{top:206px}.bowLabel,.strokeLabel{position:absolute;font-weight:900;font-size:9px;white-space:nowrap;left:50%;transform:translateX(-50%);background:rgba(3,28,51,.72);padding:2px 5px;border-radius:4px}.bowLabel{top:18px}.strokeLabel{bottom:12px}.youBoat .hull{border-color:#0b6bd3;box-shadow:inset 0 0 0 2px #75c5ff}.youBoat .bowLabel{background:#0b6bd3}.other1 .hull{background:linear-gradient(90deg,#f2d96c,#fff,#d4b64d)}.other2 .hull{background:linear-gradient(90deg,#75c3ff,#fff,#4b91c8)}.other3 .hull{background:linear-gradient(90deg,#b884ff,#fff,#8050c0)}.other4 .hull{background:linear-gradient(90deg,#67e0c8,#fff,#2c9f91)}
#leaderboard{position:absolute;right:18px;top:18px;width:210px;z-index:12;background:rgba(3,28,51,.84);border:1px solid rgba(255,255,255,.15);border-radius:15px;overflow:hidden;backdrop-filter:blur(8px)}.row{height:40px;display:flex;align-items:center;gap:10px;padding:0 12px;border-bottom:1px solid rgba(255,255,255,.08);font-size:13px}.row:last-child{border:0}.row .num{width:16px;font-weight:900}.row.you{background:rgba(30,141,240,.55)}.boatDot{width:28px;height:7px;border-radius:50%;background:#fff}.row:nth-child(2) .boatDot{background:#e9ce4f}.row:nth-child(3) .boatDot{background:#82c8ff}.row:nth-child(4) .boatDot{background:#fff}.row:nth-child(5) .boatDot{background:#a56cff}.row:nth-child(6) .boatDot{background:#48d8c0}.row:nth-child(7) .boatDot{background:#ff5d57}.row:nth-child(8) .boatDot{background:#ff9a47}
#steerPanel{position:absolute;z-index:20;left:50%;bottom:22px;transform:translateX(-50%);width:min(490px,42vw);background:rgba(3,28,51,.88);border:1px solid #178df0;border-radius:25px;padding:13px 20px 11px;backdrop-filter:blur(10px)}#steerPanel label{display:block;text-align:center;font-weight:900;font-size:17px;margin-bottom:4px}#steer{width:100%;accent-color:#69c4ff;height:34px}.steerScale{display:flex;justify-content:space-between;font-size:11px;color:#b7cee3}.sideBtn{position:absolute;bottom:24px;width:145px;height:145px;border-radius:50%;z-index:21;border:2px solid #168df0;background:rgba(3,28,51,.88);color:#fff;font-weight:900;font-size:18px;box-shadow:0 6px 20px rgba(0,0,0,.22)}#leftBtn{left:28px}#rightBtn{right:28px}.sideBtn span{display:block;font-size:46px;line-height:45px}.bottom{height:96px;flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 24px;background:#061d36}.controlGroup{display:flex;align-items:center;gap:12px}.selectWrap{background:#0a3155;border:1px solid #164d76;border-radius:12px;padding:6px 12px}.selectWrap label{display:block;font-size:10px;color:#a8c5dc}.selectWrap select{border:0;background:transparent;color:#fff;font-weight:900;font-size:15px;outline:0}.windControl{width:min(300px,28vw)}.windControl label{font-size:11px;color:#a8c5dc}.windControl input{width:100%;accent-color:#168df0}.windScale{display:flex;justify-content:space-between;font-size:9px;color:#8fb2ca}.action{height:48px;border:1px solid #287db5;border-radius:12px;padding:0 18px;background:#0a3155;color:#fff;font-weight:900}.primary{background:#168df0;border-color:#168df0}.status{font-size:12px;color:#b7cee3;min-width:160px;text-align:right}.status b{color:#fff}
@media(max-width:900px){header{height:72px;padding:8px 12px}.title{font-size:19px}.tag{display:none}.appIcon{width:38px;height:38px}.metrics .metric{min-width:92px;padding:7px 10px}.metrics .metric:nth-child(2){display:none}.metric b,.metric select{font-size:15px}.windbox{min-width:120px;padding:7px 9px}.settings{display:none}#leaderboard{width:165px;right:10px;top:10px}.row{height:34px;font-size:11px}.sideBtn{width:94px;height:94px;bottom:15px;font-size:13px}.sideBtn span{font-size:30px;line-height:29px}#leftBtn{left:10px}#rightBtn{right:10px}#steerPanel{bottom:16px;width:38vw}.bottom{height:82px;padding:7px 10px}.status{display:none}.selectWrap{padding:4px 8px}.windControl{width:25vw}}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="brand"><img class="appIcon" src="icon-192.png" alt=""><div><div class="title">Coxing Simulator</div><div class="tag">Rowing race & steering practice</div></div></div>
  <div class="metrics"><div class="metric"><small>Race Distance</small><select id="raceSelect"><option value="500">500 m</option><option value="1000">1,000 m</option><option value="2000" selected>2,000 m</option><option value="5000">5,000 m</option><option value="6000">6,000 m</option></select></div><div class="metric"><small>Race Time</small><b id="time">00:00.0</b></div><div class="metric"><small>Position</small><b id="position">4 / 8</b></div></div>
  <div class="windbox"><div class="windIcon">≋</div><div><small>Wind</small><b id="windTop">0.0 m/s</b><small id="windDir">→ Calm</small></div></div>
  <button class="settings" id="settings">⚙ Settings</button>
</header>
<div id="course">
  <div class="skyline"></div><div class="trees"></div><div class="water"></div>
  <div class="lane lane1"></div><div class="lane lane2"></div><div class="lane lane3"></div><div class="lane lane4"></div><div class="lane lane5"></div><div class="lane lane6"></div>
  <div class="buoys" id="buoys"></div><div class="start"></div><div class="finish"></div><div class="finishText">FINISH</div>
  <div id="windStreams"></div><div id="windReadout"><b id="windBig">Calm</b><small id="windSmall">Wind strength</small></div>
  <div id="boats"></div>
  <div id="leaderboard"></div>
  <button class="sideBtn" id="leftBtn"><span>‹</span>BOW</button><button class="sideBtn" id="rightBtn"> <span>›</span>STROKE</button>
  <div id="steerPanel"><label>Steer</label><input id="steer" type="range" min="-100" max="100" value="0"><div class="steerScale"><span>‹ BOW</span><span>STRAIGHT</span><span>STROKE ›</span></div></div>
</div>
<div class="bottom">
  <div class="controlGroup"><div class="selectWrap"><label>RACE</label><select id="raceSelect2"><option value="500">500 m</option><option value="1000">1,000 m</option><option value="2000" selected>2,000 m</option><option value="5000">5,000 m</option><option value="6000">6,000 m</option></select></div><div class="windControl"><label>WIND STRENGTH <b id="windSliderValue">0.0 m/s</b></label><input id="windSlider" type="range" min="0" max="15" step="0.1" value="0"><div class="windScale"><span>CALM</span><span>7.5</span><span>15 m/s</span></div></div></div>
  <div class="controlGroup"><button class="action primary" id="start">▶ Start Race</button><button class="action" id="reset">↻ Reset</button></div><div class="status"><b id="status">READY</b><br><span id="scoreText">Score 1000</span></div>
</div>
</div>
<script>
(()=>{
const $=id=>document.getElementById(id); const course=$('course'),boatsBox=$('boats'),steer=$('steer'),windSlider=$('windSlider');
let run=false,raf=0,last=0,startTime=0,elapsed=0,d=0,x=50,h=0,score=1000,windSpeed=0,windAngle=0,key=0,otherProgress=[.98,.93,.89,.84,.78,.74,.69],lastWindDraw=0;
const W=[['→','From right / Stroke'],['↘','Front-right'],['↓','Ahead'],['↙','Front-left'],['←','From left / Bow'],['↖','Rear-left'],['↑','Behind'],['↗','Rear-right']];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function setRace(v){$('raceSelect').value=v;$('raceSelect2').value=v;reset();}
function makeBuoys(){const box=$('buoys');box.innerHTML='';for(let y=22;y<96;y+=6){for(const pct of [7,22.5,38,53.5,69,84.5]){const e=document.createElement('div');e.className='buoy';e.style.left=`${pct}%`;e.style.top=`${y}%`;box.appendChild(e)}}}
function makeBoats(){boatsBox.innerHTML='';const colors=['youBoat','other1','other2','other3','other4','other1','other2','other3'];for(let i=0;i<8;i++){const b=document.createElement('div');b.className='raceBoat '+colors[i];b.dataset.i=i;b.innerHTML='<div class="hull"></div><div class="deckline"></div><div class="seatline seat1"></div><div class="seatline seat2"></div><div class="seatline seat3"></div><div class="seatline seat4"></div><div class="seatline seat5"></div>'+['70','104','138','172','206'].map((t,j)=>`<div class="oar oarL o${j+1}" style="top:${t}px"></div><div class="oar oarR o${j+1}" style="top:${t}px"></div>`).join('')+'<div class="bowLabel">BOW</div><div class="strokeLabel">STROKE</div>';boatsBox.appendChild(b)}}
function renderWind(){const box=$('windStreams');box.innerHTML='';const count=Math.round(4+windSpeed*.55);for(let i=0;i<count;i++){const e=document.createElement('div');e.className='windStream';const len=55+Math.random()*90;e.style.width=len+'px';e.style.left=(-len-Math.random()*120)+'px';e.style.top=(24+Math.random()*70)+'%';e.style.transform=`rotate(${windAngle}deg)`;e.style.animation=`windTravel ${1.8-Math.min(windSpeed/20,.6)+Math.random()*.7}s linear infinite`;e.style.animationDelay=(-Math.random()*2)+'s';box.appendChild(e)}}
const style=document.createElement('style');style.textContent='@keyframes windTravel{from{transform:translateX(-140px) rotate(var(--wa,0deg));opacity:0}15%{opacity:.8}80%{opacity:.55}to{transform:translateX(1100px) rotate(var(--wa,0deg));opacity:0}}';document.head.appendChild(style);
function windDir(){windAngle=(windAngle+Math.PI/4)%(Math.PI*2);const idx=Math.round(windAngle/(Math.PI/4))%8;const [arrow,name]=W[idx];$('windDir').textContent=arrow+' '+name;$('windSmall').textContent=name;$('windReadout').firstElementChild.textContent=windSpeed<.3?'Calm':windSpeed.toFixed(1)+' m/s';renderWind()}
function setWind(v){windSpeed=+v;$('windSlider').value=v;$('windSliderValue').textContent=windSpeed.toFixed(1)+' m/s';$('windTop').textContent=windSpeed.toFixed(1)+' m/s';$('windBig').textContent=windSpeed<.3?'Calm':windSpeed.toFixed(1)+' m/s';if(performance.now()-lastWindDraw>80){renderWind();lastWindDraw=performance.now()}}
function update(dt,t){const inp=key||(+steer.value/100);const side=Math.sin(windAngle);const head=Math.cos(windAngle);const gust=.86+.14*Math.sin(t/500);const push=side*windSpeed*.10*gust;const intoWind=Math.max(0,(-Math.sign(h||1)*side));const damping=1+intoWind*Math.min(Math.abs(head),1)*1.8;h=clamp(h+inp*.13*dt/16.67+push*.035*dt/16.67/damping,-28,28);x=clamp(x+(push*.06+h*.018)*dt/16.67,5,95);d+=dt*(0.030+0.004*Math.max(0,1-windSpeed/15));elapsed=(performance.now()-startTime)/1000;const dist=+$('raceSelect').value;const progress=clamp(d/dist,0,1);const lanePenalty=Math.max(0,Math.abs(x-50)-31);score=clamp(score-(lanePenalty*.006+Math.abs(h)*.002)*dt/16.67,0,1000);if(progress>0.995)score=clamp(score+0.1,0,1000);otherProgress=otherProgress.map((p,i)=>clamp(p+dt*(0.0000025+(i%3)*.00000035),0,1))}
function fmt(t){const m=Math.floor(t/60),s=(t%60).toFixed(1).padStart(4,'0');return String(m).padStart(2,'0')+':'+s}
function render(){const dist=+$('raceSelect').value,progress=clamp(d/dist,0,1);const rect=course.getBoundingClientRect();const top=rect.height*(0.88-progress*.70);const user=boatsBox.querySelector('.youBoat');if(user){user.style.left=x+'%';user.style.top=top+'px';user.style.transform=`translate(-50%,-50%) rotate(${h}deg)`}const all=[progress,...otherProgress].map((p,i)=>({p,i})).sort((a,b)=>b.p-a.p);const pos=all.findIndex(q=>q.i===0)+1;$('position').textContent=pos+' / 8';$('time').textContent=fmt(elapsed);$('scoreText').textContent='Score '+Math.round(score);$('status').textContent=run?'RACING':progress>=1?'FINISHED':'READY';const names=['You','Boat 1','Boat 2','Boat 3','Boat 4','Boat 5','Boat 6','Boat 7'];$('leaderboard').innerHTML=all.map((q,rank)=>`<div class="row ${q.i===0?'you':''}"><span class="num">${rank+1}</span><span class="boatDot"></span><span>${names[q.i]}</span></div>`).join('');for(const q of all){if(q.i===0)continue;const b=boatsBox.querySelector(`[data-i="${q.i}"]`);const lane=8+q.i*13;const y=rect.height*(0.88-q.p*.70);b.style.left=lane+'%';b.style.top=y+'px';b.style.transform='translate(-50%,-50%)'}$('windTop').textContent=windSpeed.toFixed(1)+' m/s';$('windBig').textContent=windSpeed<.3?'Calm':windSpeed.toFixed(1)+' m/s'}
function tick(t){if(!run)return;if(!last)last=t;const dt=Math.min(50,t-last);last=t;update(dt,t);render();if(d>=+$('raceSelect').value){finish();return}raf=requestAnimationFrame(tick)}
function finish(){run=false;cancelAnimationFrame(raf);$('start').textContent='▶ Start Again';$('status').textContent='FINISHED';render()}
function start(){if(run)return;if(d>=+$('raceSelect').value)reset();run=true;startTime=performance.now();last=0;$('start').textContent='Ⅱ Pause';raf=requestAnimationFrame(tick)}
function pause(){run=false;cancelAnimationFrame(raf);$('start').textContent='▶ Resume';render()}
function reset(){run=false;cancelAnimationFrame(raf);d=0;elapsed=0;x=50;h=0;score=1000;key=0;steer.value=0;otherProgress=[.98,.93,.89,.84,.78,.74,.69];$('start').textContent='▶ Start Race';render()}
$('start').addEventListener('click',()=>run?pause():start());$('reset').addEventListener('click',reset);$('raceSelect').addEventListener('change',e=>setRace(e.target.value));$('raceSelect2').addEventListener('change',e=>setRace(e.target.value));steer.addEventListener('input',()=>{localStorage.setItem('coxSteer',steer.value);render()});windSlider.addEventListener('input',e=>setWind(e.target.value));$('settings').addEventListener('click',()=>alert('Wind is controlled with the slider. Steer with the centre slider or BOW / STROKE buttons.'));
function hold(v){key=v}for(const [id,v] of [['leftBtn',-1],['rightBtn',1]]){const b=$(id);for(const ev of ['pointerdown','touchstart'])b.addEventListener(ev,e=>{e.preventDefault();hold(v)});for(const ev of ['pointerup','pointercancel','pointerleave','touchend','touchcancel'])b.addEventListener(ev,e=>{e.preventDefault();hold(0)})}
document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='<'){key=-1;e.preventDefault()}if(e.key==='ArrowRight'||e.key==='>'){key=1;e.preventDefault()}});document.addEventListener('keyup',e=>{if(['ArrowLeft','<','ArrowRight','>'].includes(e.key))key=0});
makeBuoys();makeBoats();setWind(0);windDir();if(localStorage.getItem('coxSteer'))steer.value=localStorage.getItem('coxSteer');render();window.addEventListener('resize',render);
})();
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}
</script>
</body></html>
